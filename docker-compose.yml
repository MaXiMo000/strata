services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: strata
      POSTGRES_PASSWORD: strata
      POSTGRES_DB: strata
    ports: ["5432:5432"]
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - pg:/var/lib/postgresql/data
  # Tiles for USGS maps (read in place from USGS's own COGs). Allmaps maps are warped in the browser and need no server.
  titiler:
    image: ghcr.io/developmentseed/titiler:latest
    ports: ["8001:80"]
    # USGS topos are NAD27: without the NOAA NADCON grid, PROJ falls back to a 7-20 m ballpark shift
    environment: { PROJ_NETWORK: "ON" }
    volumes: ["./data/cogs:/data:ro"]
    profiles: ["tiles"]
  # The app: API + built web UI on http://localhost:8000. Ingest with: docker compose run --rm app python -m strata.ingest usgs_topo
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://strata:strata@db:5432/strata
      TITILER_URL: ${TITILER_URL:-http://localhost:8001}
    ports: ["8000:8000"]
    depends_on: [db]
    volumes: ["cache:/app/data"]
    profiles: ["app"]
volumes:
  pg:
  cache:
